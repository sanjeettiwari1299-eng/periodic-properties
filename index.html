<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ShortsFire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frameWrap{position:relative;width:min(420px,100vw);height:min(100dvh,calc(min(420px,100vw)*16/9));background:#111;border-radius:0}
@media (min-width:760px){#frameWrap{border-radius:14px;height:min(92vh,800px)}}
#frame{width:100%;height:100%;border:0;display:block}
.top{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;gap:8px;align-items:center;background:linear-gradient(#000a,#0000);z-index:2}
.logo{font-weight:800;font-size:16px;margin-right:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;max-width:100%}
.chip{flex:none;background:rgba(0,0,0,.45);border:1px solid #fff3;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.chip.on{background:#fff;color:#000}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;background:linear-gradient(#0000,#000c);z-index:2;pointer-events:none}
.title{font-size:14px;line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;opacity:.75}
.bar{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:12px;z-index:3}
.btn{width:46px;height:46px;border-radius:50%;border:1px solid #fff4;background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer}
.btn:active{transform:scale(.94)}
.nav{position:absolute;left:10px;bottom:90px;display:flex;gap:8px;z-index:3}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;line-height:1.5;opacity:.85}
.ext{position:absolute;top:58px;right:12px;font-size:12px;color:#fff;opacity:.8;z-index:3}
</style>
</head>
<body>
<div id="stage">
  <div id="frameWrap">
    <div class="top">
      <div class="logo">ShortsFire</div>
      <div class="chips" id="chips"></div>
    </div>
    <iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="msg" id="msg" hidden></div>
    <a class="ext" id="ext" target="_blank" rel="noopener">YouTube par kholo ↗</a>
    <div class="bottom"><div class="title" id="title"></div><div class="meta" id="meta"></div></div>
    <div class="bar">
      <button class="btn" id="like" title="Pasand (is category ko upar)">♥</button>
      <button class="btn" id="skip" title="Kam dikhao (is category ko neeche)">✕</button>
    </div>
    <div class="nav">
      <button class="btn" id="prev" title="Pichla">‹</button>
      <button class="btn" id="next" title="Agla">›</button>
    </div>
  </div>
</div>
<script>
(function () {
  var DATA_URL = 'data/shorts.json';
  var PREF_KEY = 'sf_cat_prefs', SEEN_KEY = 'sf_seen', SEEN_MAX = 400;
  var items = [], filter = 'all', current = null, history = [], lastCats = [];

  var $ = function (id) { return document.getElementById(id); };
  var frame = $('frame'), msg = $('msg');

  function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  var prefs = load(PREF_KEY, {});
  var seen = load(SEEN_KEY, []);

  function label(cat) { return cat ? cat.replace(/_/g, ' ') : 'mix'; }

  function buildChips() {
    var cats = {};
    items.forEach(function (it) { if (it.category) cats[it.category] = (cats[it.category] || 0) + 1; });
    var list = ['all'].concat(Object.keys(cats).sort());
    var box = $('chips'); box.innerHTML = '';
    list.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'chip' + (c === filter ? ' on' : '');
      b.textContent = c === 'all' ? 'All' : label(c);
      b.onclick = function () { filter = c; buildChips(); pickNext(true); };
      box.appendChild(b);
    });
  }

  // Simple ranking: recent shorts first, category preference (likes/skips), skip recently seen, avoid repeating a category.
  function score(it, now) {
    var ageDays = Math.max(0, (now - (it.added_at || 0)) / 86400000);
    var s = 1 / (1 + ageDays / 3);
    s += 2 * (prefs[it.category] || 0);
    if (lastCats.indexOf(it.category) >= 0) s -= 0.6;
    return s + Math.random() * 0.25;
  }
  function candidates() {
    var pool = items.filter(function (it) { return (filter === 'all' || it.category === filter) && seen.indexOf(it.id) < 0; });
    if (!pool.length) { seen = []; save(SEEN_KEY, seen); pool = items.filter(function (it) { return filter === 'all' || it.category === filter; }); }
    return pool;
  }

  function show(it, push) {
    if (current && push) history.push(current);
    current = it;
    if (history.length > 100) history.shift();
    lastCats.push(it.category); if (lastCats.length > 3) lastCats.shift();
    seen.push(it.id); if (seen.length > SEEN_MAX) seen = seen.slice(-SEEN_MAX); save(SEEN_KEY, seen);
    msg.hidden = true; frame.style.visibility = 'visible';
    frame.src = 'https://www.youtube.com/embed/' + encodeURIComponent(it.id) + '?autoplay=1&playsinline=1&rel=0&modestbranding=1';
    $('title').textContent = it.title;
    $('meta').textContent = (it.channel || '') + ' · ' + label(it.category);
    $('ext').href = 'https://www.youtube.com/shorts/' + encodeURIComponent(it.id);
  }

  function pickNext(fresh) {
    if (!items.length) return showMsg('Abhi koi short nahi. Collector ke pehle run ke baad yahan aayenge.');
    var pool = candidates(), now = Date.now();
    if (!pool.length) return showMsg('Is category me abhi kuch nahi hai.');
    var best = pool[0], bs = -Infinity;
    pool.forEach(function (it) { var s = score(it, now); if (s > bs) { bs = s; best = it; } });
    show(best, !fresh);
  }

  function showMsg(t) { frame.src = 'about:blank'; frame.style.visibility = 'hidden'; msg.textContent = t; msg.hidden = false; $('title').textContent = ''; $('meta').textContent = ''; }

  function bump(cat, d) { prefs[cat] = Math.max(-3, Math.min(5, (prefs[cat] || 0) + d)); save(PREF_KEY, prefs); }

  $('next').onclick = function () { if (current) bump(current.category, 0); pickNext(false); };
  $('skip').onclick = function () { if (current) bump(current.category, -0.5); pickNext(false); };
  $('like').onclick = function () { if (current) { bump(current.category, 1); } pickNext(false); };
  $('prev').onclick = function () { if (history.length) { var p = history.pop(); current = null; show(p, false); } };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') $('next').click();
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') $('prev').click();
    else if (e.key === 'l') $('like').click();
  });

  fetch(DATA_URL, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      items = (d.items || []).filter(function (it) { return it && it.id; });
      buildChips();
      pickNext(true);
    })
    .catch(function (e) { showMsg('Shorts load nahi hue (' + e.message + ').'); });
})();
</script>
</body>
</html>
