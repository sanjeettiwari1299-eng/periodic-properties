<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shorts Fire — Reels</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050507;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;z-index:60;padding:12px 12px 8px;background:linear-gradient(#050507ee,#05050700)}
#top .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#top h1{font-size:20px;font-weight:800}
#top h1 span{color:#ff375f}
.iconBtn{background:#14141c;border:1px solid #2a2a38;color:#fff;border-radius:10px;padding:6px 10px;font-size:16px;cursor:pointer}
#chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #2a2a38;background:#14141c;color:#ddd;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,#ff2d4b,#ff6b2b);border-color:transparent;color:#fff;font-weight:700}
#feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;outline:none}
#feed::-webkit-scrollbar{display:none}
.short{height:100vh;height:100dvh;width:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.short .ph{position:absolute;inset:0;background:#111 center/cover no-repeat;z-index:0}
.short iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
.short .shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0) 45%)}
.short .tap{position:absolute;inset:0;z-index:3}
.short .info{position:absolute;left:14px;right:84px;bottom:calc(28px + env(safe-area-inset-bottom));z-index:4;pointer-events:none;text-shadow:0 1px 4px #000}
.short .info b{display:block;font-size:16px;line-height:1.35;margin-bottom:6px}
.short .info small{color:#ddd;font-size:13px}
.actions{position:absolute;right:10px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;gap:16px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#eee;cursor:pointer;user-select:none;background:none;border:0}
.act .ico{width:44px;height:44px;border-radius:50%;background:#ffffff1f;display:flex;align-items:center;justify-content:center;font-size:20px}
.act .ico.on{background:#ff375f}
.heart{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(0);font-size:90px;z-index:6;pointer-events:none;transition:transform .25s,opacity .4s;opacity:0}
.heart.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#msg{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#aaa;line-height:1.7;font-size:15px}
.overlay{position:fixed;inset:0;z-index:100;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.sheet{background:#14141c;border:1px solid #2a2a38;border-radius:16px;padding:18px;width:min(380px,100%);text-align:center}
.sheet h2{font-size:18px;margin-bottom:10px}
.sheet p{color:#9a9aae;font-size:13px;line-height:1.6;margin:6px 0 12px}
.sheet .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sheet button{background:#1d1d29;border:1px solid #2a2a38;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
.sheet button.hot{background:linear-gradient(135deg,#ff2d4b,#ff6b2b);border:0;font-weight:700}
#stats{font-size:12px;color:#9a9aae;text-align:left;margin:8px 0 12px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:120;display:none}
</style>
</head>
<body>
<div id="top">
  <div class="row">
    <h1>Reels <span>·</span></h1>
    <button class="iconBtn" id="btnSettings" aria-label="Settings">⚙️</button>
  </div>
  <div id="chips"></div>
</div>
<div id="feed" tabindex="0"></div>

<div class="overlay" id="moodPanel">
  <div class="sheet">
    <h2>Abhi mood kya hai?</h2>
    <p>Isi se feed tumhare mood ke hisaab se chalegi.</p>
    <div class="btns" id="moodBtns"></div>
  </div>
</div>

<div class="overlay" id="checkoutPanel">
  <div class="sheet">
    <h2 id="coQ">Kaisa feel ho rahe ho?</h2>
    <p>Isi se feed tumhare liye adjust hogi.</p>
    <div class="btns">
      <button class="hot" data-k="better">😊 Better</button>
      <button data-k="same">😐 Same</button>
      <button data-k="worse">😞 Worse</button>
      <button data-k="skip">Abhi nahi</button>
    </div>
  </div>
</div>

<div class="overlay" id="settings">
  <div class="sheet">
    <h2>⚙️ Settings</h2>
    <div id="stats"></div>
    <div class="btns">
      <button class="hot" id="sReload">🔄 Feed reload</button>
      <button id="sMood">🧠 Mood badlo</button>
      <button id="sReset">🎛️ Taste reset</button>
      <button id="sClose">Close</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import { buildFeed, recordSignal, recordCheckout, emptyState, trimState, currentTimeSlot } from './js/algo.js';

// Data: GitHub Actions (scripts/fetch-shorts.mjs) InnerTube se data/shorts.json update karta hai.
const DATA_URL = './data/shorts.json';
const MOODS = [['happy','😊 Happy'],['sad','😔 Sad'],['very_sad','💔 Very sad'],['focus','🎯 Focus'],['bhakti','🙏 Bhakti']];
const CHIPS = [
  {e:'✨',label:'All',cats:[]},
  {e:'😂',label:'Comedy',cats:['comedy','hindi_film_comedy','comedy_quotes','public_comedy']},
  {e:'🦚',label:'Krishna',cats:['krishna','radhakrishna_serial']},
  {e:'🙏',label:'Bhakti',cats:['bhakti','bhajans','geeta','pravachan','katha','ramayan','mahabharat','hanuman','devotion','spiritual_quotes']},
  {e:'🧠',label:'Psychology',cats:['psychology','psychology_tricks','dark_psychology','manipulation_awareness']},
  {e:'💔',label:'Shayari',cats:['sad_songs','heartbreak','shayari']},
  {e:'🎵',label:'Songs',cats:['old_songs','music','peaceful_piano','aura_music']},
  {e:'🔥',label:'Attitude',cats:['attitude','attitude_songs','dialogue_status']},
  {e:'💪',label:'Motivation',cats:['motivation','life_lessons']},
  {e:'🔬',label:'Sci-Tech',cats:['science','tech']}
];

const $ = id => document.getElementById(id);
const feedEl = $('feed');
const STATE_KEY = 'sf_state_v1';
let state = loadState();
let mood = localStorage.getItem('sf_mood') || '';
let chipIdx = 0;
let candidates = [];
let seen = new Set();
let sess = { cats: new Map(), reels: 0 };
let pendingMood = null;
let observer = null;
const cards = new Map();   // id -> {v, el, iframe, t0, muted}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2000);}

/* ---------- state (browser only) ---------- */
function loadState(){
  try{ const raw = localStorage.getItem(STATE_KEY); if(raw) return Object.assign(emptyState(), JSON.parse(raw)); }catch(e){}
  return emptyState();
}
function saveState(){ try{ trimState(state); localStorage.setItem(STATE_KEY, JSON.stringify(state)); }catch(e){} }
function signal(v, event, value){
  const lastCats = [...sess.cats.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  recordSignal(state, v, event, value||0, mood || 'focus', lastCats);
  saveState();
}

/* ---------- data ---------- */
async function loadData(){
  feedEl.innerHTML = '<div id="msg">Loading...</div>';
  try{
    const res = await fetch(DATA_URL + '?v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    candidates = (j.videos||[]).filter(v=>/^[A-Za-z0-9_-]{11}$/.test(v.video_id));
  }catch(e){
    feedEl.innerHTML = '<div id="msg">Shorts data nahi mila.<br><small>'+esc(e.message)+'</small></div>';
    return;
  }
  if(!mood) openOverlay('moodPanel');
  refreshFeed(true);
}

/* ---------- chips + mood ---------- */
function renderChips(){
  $('chips').innerHTML = CHIPS.map((c,i)=>'<button class="chip'+(i===chipIdx?' on':'')+'" data-i="'+i+'">'+c.e+' '+esc(c.label)+'</button>').join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ chipIdx=Number(b.dataset.i); renderChips(); refreshFeed(true); });
}
function renderMoodButtons(){
  $('moodBtns').innerHTML = MOODS.map(([k,l])=>'<button data-m="'+k+'">'+l+'</button>').join('');
  $('moodBtns').querySelectorAll('button').forEach(b=>b.onclick=()=>setMood(b.dataset.m));
}
function setMood(m){
  const prev = mood;
  mood = m;
  localStorage.setItem('sf_mood', m);
  closeOverlay('moodPanel');
  if(prev && prev!==m && sess.reels>0){ pendingMood = m; openCheckout(); return; }
  newSession();
  refreshFeed(true);
}
function newSession(){ sess = { cats: new Map(), reels: 0 }; }
function openCheckout(){
  const emo = {happy:'😊',sad:'😔',very_sad:'💔',focus:'🎯',bhakti:'🙏'}[mood]||'🎯';
  $('coQ').textContent = sess.reels+' reels ke baad ab kaisa feel ho raha hai? '+emo;
  openOverlay('checkoutPanel');
}
function answerCheckout(kind){
  closeOverlay('checkoutPanel');
  if(kind!=='skip' && sess.cats.size){
    const cats = [...sess.cats.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
    recordCheckout(state, mood, kind, cats);
    saveState();
    toast(kind==='better'?'Noted 🙏 accha laga':kind==='worse'?'Noted 🙏 agla feed better dunga':'Noted 🙏');
  }
  if(pendingMood){ mood = pendingMood; localStorage.setItem('sf_mood', mood); pendingMood = null; }
  newSession();
  refreshFeed(true);
}
function openOverlay(id){ $(id).classList.add('show'); }
function closeOverlay(id){ $(id).classList.remove('show'); }

/* ---------- feed ---------- */
function refreshFeed(reset){
  if(!candidates.length){ feedEl.innerHTML = '<div id="msg">Abhi koi short nahi hai. Collector ka pehla run baaki hai.</div>'; return; }
  if(reset) seen = new Set();
  const list = buildFeed(candidates, state, {
    mood: mood || 'focus', cats: CHIPS[chipIdx].cats, limit: 60,
    sessionCats: sess.cats, fatigue: sess.reels > 40
  }).filter(v => !seen.has(v.video_id));
  list.forEach(v=>seen.add(v.video_id));
  cards.forEach(c=>{ if(c.iframe) c.iframe.remove(); });
  cards.clear();
  feedEl.innerHTML = '';
  if(!list.length){ feedEl.innerHTML = '<div id="msg">Is filter me abhi kuch nahi hai. Chip badlo ya Reload karo.</div>'; return; }
  list.forEach(v=>feedEl.appendChild(card(v)));
  feedEl.scrollTop = 0;
  attachObserver();
}

function card(v){
  const el = document.createElement('section');
  el.className = 'short';
  el.dataset.id = v.video_id;
  const liked = state.liked.includes(v.video_id);
  const followed = state.follows.includes(v.channel);
  el.innerHTML =
    '<div class="ph" style="background-image:url(https://i.ytimg.com/vi/'+v.video_id+'/hqdefault.jpg)"></div>'+
    '<div class="shade"></div>'+
    '<div class="heart">❤️</div>'+
    '<div class="info"><b>'+esc(v.title)+'</b><small>'+esc(v.channel)+(v.category?' · '+esc(v.category):'')+'</small></div>'+
    '<div class="actions">'+
      '<button class="act" data-a="follow"><span class="ico" id="fo-'+v.video_id+'">'+(followed?'✓':'+')+'</span><span>Follow</span></button>'+
      '<button class="act" data-a="like"><span class="ico'+(liked?' on':'')+'" id="lk-'+v.video_id+'">'+(liked?'❤️':'🤍')+'</span><span>Like</span></button>'+
      '<button class="act" data-a="more"><span class="ico">✨</span><span>More</span></button>'+
      '<button class="act" data-a="less"><span class="ico">🚫</span><span>Less</span></button>'+
      '<button class="act" data-a="share"><span class="ico">↗️</span><span>Share</span></button>'+
      '<button class="act" data-a="sound"><span class="ico">🔇</span><span>Sound</span></button>'+
    '</div>'+
    '<div class="tap"></div>';
  cards.set(v.video_id, { v, el, iframe: null, t0: 0, muted: true });

  let lastTap = 0;
  el.querySelector('.tap').addEventListener('click', ()=>{
    const now = Date.now();
    if(now - lastTap < 300){ doubleTapLike(v.video_id); lastTap = 0; } else { lastTap = now; }
  });
  el.querySelectorAll('.act').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); action(v, b.dataset.a); }));
  return el;
}

function action(v, a){
  if(a==='like') toggleLike(v.video_id);
  else if(a==='more'){ signal(v,'more_like_this'); toast('Aise aur dikhayenge ✨'); }
  else if(a==='less'){
    signal(v,'not_interested');
    const c = cards.get(v.video_id); if(c){ c.el.remove(); cards.delete(v.video_id); }
    toast('Kam dikhayenge 🚫');
  }
  else if(a==='share'){
    const url = 'https://www.youtube.com/shorts/'+v.video_id;
    signal(v,'share');
    if(navigator.share) navigator.share({title:v.title,url}).catch(()=>{});
    else if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('Link copy ho gaya')).catch(()=>{});
  }
  else if(a==='follow'){
    const i = state.follows.indexOf(v.channel);
    if(i>=0) state.follows.splice(i,1); else state.follows.push(v.channel);
    saveState();
    const fo = $('fo-'+v.video_id); if(fo) fo.textContent = i>=0 ? '+' : '✓';
    toast(i>=0 ? 'Unfollow' : 'Following ✓');
  }
  else if(a==='sound') toggleSound(v.video_id);
}
function toggleLike(id){
  const c = cards.get(id); const v = c ? c.v : null; if(!v) return;
  const on = state.liked.includes(id);
  signal(v, on ? 'unlike' : 'like');
  if(on) state.liked = state.liked.filter(x=>x!==id); else if(!state.liked.includes(id)) state.liked.push(id);
  saveState();
  const lk = $('lk-'+id); if(lk){ lk.textContent = on?'🤍':'❤️'; lk.classList.toggle('on', !on); }
}
function doubleTapLike(id){
  const c = cards.get(id);
  if(c){ const h = c.el.querySelector('.heart'); h.classList.add('show'); setTimeout(()=>h.classList.remove('show'),500); }
  if(!state.liked.includes(id)) toggleLike(id);
}
function toggleSound(id){
  const c = cards.get(id); if(!c) return;
  c.muted = !c.muted;
  const ico = c.el.querySelector('[data-a="sound"] .ico'); if(ico) ico.textContent = c.muted ? '🔇' : '🔊';
  if(c.iframe) c.iframe.src = embedUrl(id, c.muted);
}
function embedUrl(id, muted){
  return 'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&mute='+(muted?1:0)+'&playsinline=1&rel=0&modestbranding=1&controls=0&loop=1&playlist='+id;
}

/* ---------- visibility: play visible reel, count watch time ---------- */
function attachObserver(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(entries=>{
    for(const en of entries){
      const c = cards.get(en.target.dataset.id); if(!c) continue;
      if(en.isIntersecting && en.intersectionRatio >= 0.75) enter(c);
      else if(!en.isIntersecting || en.intersectionRatio < 0.5) leave(c);
    }
  },{root:feedEl,threshold:[0,0.5,0.75]});
  feedEl.querySelectorAll('.short').forEach(s=>observer.observe(s));
}
function enter(c){
  if(c.t0) return;
  c.t0 = Date.now();
  sess.reels++;
  const cat = c.v.category; if(cat) sess.cats.set(cat, (sess.cats.get(cat)||0)+1);
  for(const o of cards.values()) if(o!==c && o.t0) leave(o);   // only one reel plays
  if(!c.iframe){
    const f = document.createElement('iframe');
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.src = embedUrl(c.v.video_id, c.muted);
    c.el.querySelector('.tap').before(f);
    c.iframe = f;
  }
}
function leave(c){
  if(!c.t0) return;
  const ms = Date.now() - c.t0;
  c.t0 = 0;
  if(c.iframe){ c.iframe.src = 'about:blank'; c.iframe.remove(); c.iframe = null; }
  if(ms >= 300) signal(c.v, 'watch_ms', ms);
  if(ms >= 3000 && !state.watched.includes(c.v.video_id)){ state.watched.push(c.v.video_id); saveState(); }
}

/* ---------- wiring ---------- */
$('btnSettings').onclick = ()=>{ renderStats(); openOverlay('settings'); };
$('sClose').onclick = ()=>closeOverlay('settings');
$('sReload').onclick = ()=>{ closeOverlay('settings'); loadData(); };
$('sMood').onclick = ()=>{ closeOverlay('settings'); openOverlay('moodPanel'); };
$('sReset').onclick = ()=>{
  if(!confirm('Taste reset karna hai? (likes, follows, preferences sab hat jayega)')) return;
  state = emptyState(); saveState(); closeOverlay('settings'); toast('Taste reset ho gaya'); refreshFeed(true);
};
document.querySelectorAll('#checkoutPanel button[data-k]').forEach(b=>b.onclick=()=>answerCheckout(b.dataset.k));
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ const h = feedEl.clientHeight; feedEl.scrollBy({top:e.key==='ArrowDown'?h:-h,behavior:'smooth'}); }
});
function renderStats(){
  const top = Object.entries(state.prefs).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c,s])=>c+':'+s).join(', ') || 'abhi kuch nahi';
  $('stats').innerHTML = 'Mood: <b>'+esc(mood||'-')+'</b> · Slot: <b>'+currentTimeSlot()+'</b> · Shorts: <b>'+candidates.length+'</b><br>'+
    'Likes: '+state.liked.length+' · Follows: '+state.follows.length+' · Watched: '+state.watched.length+' · Signals: '+state.events+'<br>'+
    'Top prefs: '+esc(top);
}

renderChips();
renderMoodButtons();
loadData();
</script>
</body>
</html>
