# Cloudflare Worker — exact copy of worker.js (no code changes).
# Deploy: npx wrangler deploy  (from this folder)
# Secrets (wrangler secret put ...):
#   TURSO_AUTH_TOKEN      = LayerBase libSQL auth token
#   CRON_SECRET           = any long random string (admin endpoints)
#   YOUTUBE_API_KEY       = optional (collect uses YouTube Data API)
# Vars:
#   TURSO_DATABASE_URL    = https://<host>.cloud.layerbase.dev  (LayerBase libSQL URL; libsql:// also accepted)
# Telegram/grab (TG_BOT_TOKEN, TG_CHAT_ID, YT cookies) are NOT set => the worker runs without them.

name = "shortsfire"
main = "worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["17 */6 * * *", "* * * * *"]
