# Collector: started every 30 min by cron-job.org (repository_dispatch "collect").
# Fetches Shorts via InnerTube, stores them in LayerBase libSQL, and commits data/shorts.json for the page.
name: Collect shorts

on:
  repository_dispatch:
    types: [collect]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-shorts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run collector
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/collect.mjs
      - name: Commit updated shorts
        run: |
          git config user.name "shorts-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/shorts.json
          if git diff --cached --quiet; then
            echo "No change in data/shorts.json"
          else
            git commit -m "chore: update shorts ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
